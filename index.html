<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Charging Points UK</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { background: #1a73e8; color: white; padding: 1rem; text-align: center; }
  h1 { margin: 0; font-size: 1.8rem; }
  #map { height: 70vh; width: 100%; }
  .controls { padding: 1rem; text-align: center; }
  .coming-soon { padding: 1rem; text-align: center; background: #f2f2f2; }
  input, select, button { padding: 0.5rem; margin: 0.3rem; }
</style>
</head>
<body>

<header>
  <h1>EV Charging Points UK</h1>
</header>

<div class="controls">
  <label for="city">Select UK City:</label>
  <select id="city">
    <option value="">--Choose a city--</option>
    <option value="London">London</option>
    <option value="Manchester">Manchester</option>
    <option value="Birmingham">Birmingham</option>
    <option value="Glasgow">Glasgow</option>
    <option value="Liverpool">Liverpool</option>
  </select>
  <button id="showBtn">Show Chargers</button>
</div>

<div id="map"></div>

<div class="coming-soon">
  <h2>Coming Soon: UAE & Saudi Arabia</h2>
  <p>Subscribe to get notified when we launch!</p>
  <input type="email" id="email" placeholder="Enter your email"/>
  <button id="subscribeBtn">Subscribe</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([54.5, -3], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  let markers = [];

  const cityCoords = {
      "London": [51.5074, -0.1278],
      "Manchester": [53.4808, -2.2426],
      "Birmingham": [52.4862, -1.8904],
      "Glasgow": [55.8642, -4.2518],
      "Liverpool": [53.4084, -2.9916]
  };

  document.getElementById('showBtn').addEventListener('click', async () => {
      const city = document.getElementById('city').value;
      if (!city) return alert('Please select a city');

      // Clear previous markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      map.setView(cityCoords[city], 12);

      try {
          const res = await fetch(`https://api.openchargemap.io/v3/poi/?output=json&countrycode=GB&latitude=${cityCoords[city][0]}&longitude=${cityCoords[city][1]}&maxresults=20`);
          const data = await res.json();

          if (!data.length) return alert('No chargers found in this city');

          data.forEach(point => {
              const lat = point.AddressInfo.Latitude;
              const lon = point.AddressInfo.Longitude;
              const marker = L.marker([lat, lon]).addTo(map);
              marker.bindPopup(`<b>${point.AddressInfo.Title}</b><br>${point.AddressInfo.AddressLine1 || ''}`);
              markers.push(marker);
          });
