<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Charging Points</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; }
header { background:#1a73e8; color:white; padding:1rem; text-align:center; }
h1 { margin:0; font-size:1.8rem; }
#map { height:75vh; width:100%; }
.controls { padding:1rem; text-align:center; }
select, button, input { padding:0.5rem; margin:0.3rem; }
.coming-soon { padding:1rem; text-align:center; background:#f2f2f2; }
</style>
</head>
<body>

<header>
  <h1>EV Charging Points</h1>
  <div style="text-align:center; margin-top:10px;">
    <label for="country">Select Country:</label>
    <select id="country">
      <option value="UK" selected>UK</option>
      <option value="UAE">UAE</option>
      <option value="KSA">Saudi Arabia</option>
    </select>
  </div>
</header>

<div class="controls" id="ukControls">
  <label for="city">Select UK City / Option:</label>
  <select id="city">
    <option value="">--Choose--</option>
    <option value="London">London</option>
    <option value="Manchester">Manchester</option>
    <option value="Birmingham">Birmingham</option>
    <option value="Glasgow">Glasgow</option>
    <option value="Liverpool">Liverpool</option>
    <option value="Edinburgh">Edinburgh</option>
    <option value="Leeds">Leeds</option>
    <option value="Bristol">Bristol</option>
    <option value="Sheffield">Sheffield</option>
    <option value="Cardiff">Cardiff</option>
    <option value="Newcastle">Newcastle</option>
    <option value="Motorways">UK Motorways & Major Roads</option>
  </select>
  <button id="showBtn">Show Chargers</button>
</div>

<div id="map"></div>

<div class="coming-soon">
  <h2>Subscribe for Updates</h2>
  <p>Get notified when we launch in UAE & Saudi Arabia!</p>
  <input type="email" id="email" placeholder="Enter your email"/>
  <button id="subscribeBtn">Subscribe</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([54.5,-3],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    subdomains:'abcd', maxZoom:19
}).addTo(map);

const cityIcon = new L.Icon({
    iconUrl:'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
    iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-30]
});
const motorwayIcon = new L.Icon({
    iconUrl:'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
    iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-30]
});

let markers=[];
const countrySelector=document.getElementById('country');
const ukControls=document.getElementById('ukControls');

countrySelector.addEventListener('change',()=>{
    const selected=countrySelector.value;
    if(selected==="UK"){
        ukControls.style.display="block"; map.setView([54.5,-3],5);
    } else{
        ukControls.style.display="none";
        alert(`${selected==="UAE"?"UAE":"Saudi Arabia"} coming soon! Subscribe to get notified.`);
        map.setView(selected==="UAE"?[24.4539,54.3773]:[24.7136,46.6753],6);
    }
});

document.getElementById('showBtn').addEventListener('click',async()=>{
    const city=document.getElementById('city').value;
    if(!city) return alert('Please select a city or option');

    markers.forEach(m=>map.removeLayer(m));
    markers=[];

    try{
        const res=await fetch(`/api/getUKChargers?city=${city}`);
        if(!res.ok) throw new Error('Failed fetch');
        const data=await res.json();

        if(!data.length) return alert('No chargers found for this selection');

        data.forEach(point=>{
            if(point.AddressInfo && point.AddressInfo.Latitude && point.AddressInfo.Longitude){
                const plat=point.AddressInfo.Latitude;
                const plon=point.AddressInfo.Longitude;
                if(!point.StatusType || point.StatusType.IsOperational){
                    const title=point.AddressInfo.Title||"EV Charger";
                    const town=point.AddressInfo.Town||"";
                    const address=point.AddressInfo.AddressLine1||"";
                    const postcode=point.AddressInfo.Postcode||"";
                    const gmapsUrl=`https://www.google.com/maps/dir/?api=1&destination=${plat},${plon}`;
                    const iconType=city==="Motorways"?motorwayIcon:cityIcon;

                    const marker=L.marker([plat,plon],{icon:iconType}).addTo(map);
                    marker.bindPopup(`<b>${title}</b><br>${town}<br>${address}<br>${postcode}<br><a href="${gmapsUrl}" target="_blank">📍 Get Directions</a>`);
                    markers.push(marker);
                }
            }
        });

        if(city!=="Motorways" && data.length){
            const first=data[0];
            map.setView([first.AddressInfo.Latitude,first.AddressInfo.Longitude],11);
        }

    } catch(err){ console.error(err); alert('Error loading EV chargers. Try again later.'); }
});

document.getElementById('subscribeBtn').addEventListener('click',()=>{
    const email=document.getElementById('email').value;
    if(!email) return alert('Please enter your email');
    alert(`Thanks! We'll notify you at ${email} when we launch in UAE & Saudi Arabia.`);
    document.getElementById('email').value='';
});
</script>
</body>
</html>
