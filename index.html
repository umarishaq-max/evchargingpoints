<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Charging Points</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { background: #1a73e8; color: white; padding: 1rem; text-align: center; }
  h1 { margin: 0; font-size: 1.8rem; }
  #map { height: 75vh; width: 100%; }
  .controls { padding: 1rem; text-align: center; display: none; }
  select, button, input { padding: 0.5rem; margin: 0.3rem; }
  .coming-soon { padding: 1rem; text-align: center; background: #f2f2f2; }
  .legend i { display: inline-block; width: 20px; height: 20px; margin-right: 6px; }
</style>
</head>
<body>

<header>
  <h1>EV Charging Points</h1>
  <div style="text-align:center; margin-top:10px;">
    <label for="country">Select Country:</label>
    <select id="country">
      <option value="UK" selected>UK</option>
      <option value="UAE">UAE</option>
      <option value="KSA">Saudi Arabia</option>
    </select>
  </div>
</header>

<div class="controls" id="ukControls">
  <label for="city">Select UK City / Option:</label>
  <select id="city">
    <option value="">--Choose--</option>
    <option value="London">London</option>
    <option value="Manchester">Manchester</option>
    <option value="Birmingham">Birmingham</option>
    <option value="Glasgow">Glasgow</option>
    <option value="Liverpool">Liverpool</option>
    <option value="Edinburgh">Edinburgh</option>
    <option value="Leeds">Leeds</option>
    <option value="Bristol">Bristol</option>
    <option value="Sheffield">Sheffield</option>
    <option value="Cardiff">Cardiff</option>
    <option value="Newcastle">Newcastle</option>
    <option value="Motorways">UK Motorways & Major Roads</option>
  </select>
  <button id="showBtn">Show Chargers</button>
</div>

<div id="map"></div>

<div class="coming-soon">
  <h2>Subscribe for Updates</h2>
  <p>Get notified when we launch in UAE & Saudi Arabia!</p>
  <input type="email" id="email" placeholder="Enter your email"/>
  <button id="subscribeBtn">Subscribe</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Initialize map with English tiles
  const map = L.map('map').setView([54.5, -3], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
      subdomains: 'abcd',
      maxZoom: 19
  }).addTo(map);

  // Icons
  const cityIcon = new L.Icon({
      iconUrl: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
  });
  const motorwayIcon = new L.Icon({
      iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
  });

  // UK city coordinates
  const cityCoords = {
      "London": [51.5074, -0.1278],
      "Manchester": [53.4808, -2.2426],
      "Birmingham": [52.4862, -1.8904],
      "Glasgow": [55.8642, -4.2518],
      "Liverpool": [53.4084, -2.9916],
      "Edinburgh": [55.9533, -3.1883],
      "Leeds": [53.8008, -1.5491],
      "Bristol": [51.4545, -2.5879],
      "Sheffield": [53.3811, -1.4701],
      "Cardiff": [51.4816, -3.1791],
      "Newcastle": [54.9784, -1.6174]
  };

  const apiKey = "9e32798c-5e2f-4146-bb18-5870fd74e0ec";
  let markers = [];

  // Country selector
  const countrySelector = document.getElementById('country');
  const ukControls = document.getElementById('ukControls');

  countrySelector.addEventListener('change', () => {
      const selected = countrySelector.value;
      if(selected === "UK"){
          ukControls.style.display = "block";
          map.setView([54.5, -3], 5);
      } else {
          ukControls.style.display = "none";
          alert(`${selected === "UAE" ? "UAE" : "Saudi Arabia"} coming soon! Subscribe to get notified.`);
          map.setView(selected === "UAE" ? [24.4539, 54.3773] : [24.7136, 46.6753], 6);
      }
  });

  // Show chargers for selected UK city or motorways
  document.getElementById('showBtn').addEventListener('click', async () => {
      const city = document.getElementById('city').value;
      if (!city) return alert('Please select a city or option');

      // Remove existing markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      let lat, lon, zoom, distance;
      const isMotorway = city === "Motorways";

      if (isMotorway) {
          lat = 52.5; lon = -1.5;
          zoom = 6; distance = 100;
      } else {
          [lat, lon] = cityCoords[city];
          zoom = 11; distance = 25;
      }

      map.setView([lat, lon], zoom);

      try {
          const res = await fetch(`https://api.openchargemap.io/v3/poi/?output=json&countrycode=GB&latitude=${lat}&longitude=${lon}&maxresults=500&distance=${distance}&distanceunit=KM&key=${apiKey}`);
          const data = await res.json();

          if (!data.length) return alert('No chargers found for this selection');

          data.forEach(point => {
              if (point.StatusType && point.StatusType.IsOperational) {
                  const lat = point.AddressInfo.Latitude;
                  const lon = point.AddressInfo.Longitude;
                  const title = point.AddressInfo.Title || "EV Charger";
                  const town = point.AddressInfo.Town || "";
                  const address = point.AddressInfo.AddressLine1 || "";
                  const postcode = point.AddressInfo.Postcode || "";
                  const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
                  const iconType = isMotorway ? motorwayIcon : cityIcon;

                  const popupContent = `<b>${title}</b><br>${town}<br>${address}<br>${postcode}<br>
                                        <a href="${gmapsUrl}" target="_blank">📍 Get Directions</a>`;

                  const marker = L.marker([lat, lon], { icon: iconType }).addTo(map);
                  marker.bindPopup(popupContent);
                  markers.push(marker);
              }
          });
      } catch(err) {
          alert('Error loading EV chargers. Try again later.');
          console.error(err);
      }
  });

  // Subscribe form
  document.getElementById('subscribeBtn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      if (!email) return alert('Please enter your email');
      alert(`Thanks! We'll notify you at ${email} when we launch in UAE & Saudi Arabia.`);
      document.getElementById('email').value = '';
  });

  // Legend
  const legend = L.control({position: 'bottomright'});
  legend.onAdd = function(map) {
      const div = L.DomUtil.create('div', 'info legend');
      div.style.backgroundColor = 'white';
      div.style.padding = '8px';
      div.style.borderRadius = '5px';
      div.style.boxShadow = '0 0 6px rgba(0,0,0,0.3)';
      div.innerHTML = `<h4>Legend</h4>
                       <i style="background: url('https://maps.google.com/mapfiles/ms/icons/blue-dot.png') no-repeat; width: 20px; height: 20px;"></i> City Charger<br>
                       <i style="background: url('https://maps.google.com/mapfiles/ms/icons/green-dot.png') no-repeat; width: 20px; height: 20px;"></i> Motorway Charger`;
      return div;
  };
  legend.addTo(map);

</script>
</body>
</html>
