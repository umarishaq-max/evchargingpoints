<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Charging Points</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { background: #1a73e8; color: white; padding: 1rem; text-align: center; }
  h1 { margin: 0; font-size: 1.8rem; }
  #map { height: 80vh; width: 100%; }
  .controls { padding: 1rem; text-align: center; display: none; }
  select, button, input { padding: 0.5rem; margin: 0.3rem; }
  .coming-soon { padding: 1rem; text-align: center; background: #f2f2f2; }
</style>
</head>
<body>

<header>
  <h1>EV Charging Points</h1>
</header>

<div class="controls" id="ukControls">
  <label for="city">Select UK City:</label>
  <select id="city">
    <option value="">--Choose a city--</option>
    <option value="London">London</option>
    <option value="Manchester">Manchester</option>
    <option value="Birmingham">Birmingham</option>
    <option value="Glasgow">Glasgow</option>
    <option value="Liverpool">Liverpool</option>
  </select>
  <button id="showBtn">Show Chargers</button>
</div>

<div id="map"></div>

<div class="coming-soon">
  <h2>Subscribe for Updates</h2>
  <p>Get notified when we launch in UAE & Saudi Arabia!</p>
  <input type="email" id="email" placeholder="Enter your email"/>
  <button id="subscribeBtn">Subscribe</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Initialize map
  const map = L.map('map').setView([20, 0], 2); // World view
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Regions
  const regions = [
    { name: "UK", coords: [54.5, -3], zoom: 5, type: "interactive" },
    { name: "UAE", coords: [24.4539, 54.3773], zoom: 6, type: "coming" },
    { name: "Saudi Arabia", coords: [24.7136, 46.6753], zoom: 5, type: "coming" }
  ];

  regions.forEach(region => {
      const marker = L.marker(region.coords).addTo(map);
      marker.bindPopup(`<b>${region.name}</b><br>Click to explore`).on('click', () => {
          if (region.type === "interactive") {
              document.getElementById('ukControls').style.display = 'block';
              map.setView(region.coords, region.zoom);
          } else {
              alert(`${region.name} coming soon! Subscribe to get notified.`);
          }
      });
  });

  // UK city coordinates
  const cityCoords = {
      "London": [51.5074, -0.1278],
      "Manchester": [53.4808, -2.2426],
      "Birmingham": [52.4862, -1.8904],
      "Glasgow": [55.8642, -4.2518],
      "Liverpool": [53.4084, -2.9916]
  };

  const apiKey = "9e32798c-5e2f-4146-bb18-5870fd74e0ec";
  let markers = [];

  // Show chargers for selected city
  document.getElementById('showBtn').addEventListener('click', async () => {
      const city = document.getElementById('city').value;
      if (!city) return alert('Please select a city');

      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const [lat, lon] = cityCoords[city];
      map.setView([lat, lon], 12);

      try {
          const res = await fetch(`https://api.openchargemap.io/v3/poi/?output=json&countrycode=GB&latitude=${lat}&longitude=${lon}&maxresults=20&key=${apiKey}`);
          const data = await res.json();

          if (!data.length) return alert('No chargers found in this city');

          data.forEach(point => {
              const marker = L.marker([point.AddressInfo.Latitude, point.AddressInfo.Longitude]).addTo(map);
              marker.bindPopup(`<b>${point.AddressInfo.Title}</b><br>${point.AddressInfo.AddressLine1 || ''}`);
              markers.push(marker);
          });
      } catch(err) {
          alert('Error loading EV chargers. Try again later.');
          console.error(err);
      }
  });

  // Subscribe button
  document.getElementById('subscribeBtn').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      if (!email) return alert('Please enter your email');
      alert(`Thanks! We'll notify you at ${email} when we launch in UAE & Saudi Arabia.`);
      document.getElementById('email').value = '';
  });
</script>

</body>
</html>
